plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'com.arxyt'
version = '0.7.0'

base { archivesName = 'territorycontrolcompat' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

repositories { mavenCentral() }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf(files('../TerritoryControl-1.20.1/build/libs/territorycontrol-0.10.16.jar'))
    // Rat Warlords' release JAR is reobfuscated. Compile against its official-mapping class output
    // so calls through the public faction API remain valid in this ForgeGradle userdev workspace.
    implementation files('../RatNations-1.20.1/build/classes/java/main')
    // The natural-refresh bridge invokes the public Rat Nations entity configuration methods.
    // These jars support compilation and the dependency-free verification process; they are not
    // bundled into the compat artifact because Forge loads the actual mods at runtime.
    def geckolibDevJar = files('../../versions/国潮红师2/mods/[Marbled的军械库前置]geckolib-forge-1.20.1-4.8.4.jar')
    def taczDevJar = files('../../versions/国潮红师2/mods/[TACZ枪械]tacz-1.20.1-1.1.8-hotfix.jar')
    compileOnly geckolibDevJar
    compileOnly taczDevJar
    runtimeOnly geckolibDevJar
    runtimeOnly taczDevJar
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
            'MixinConfigs': 'territorycontrolcompat.mixins.json',
            'Specification-Title': 'territorycontrolcompat',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'ARXYT'
    ])
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('verifySporeCompat', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free Spore infection block classification checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.arxyt.territorycontrolcompat.compat.SporeCompatVerification'
}

tasks.register('verifyRatNationsNaturalRefresh', JavaExec) {
    group = 'verification'
    description = 'Runs Rat Nations natural-refresh configuration and weighted-pool checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.arxyt.territorycontrolcompat.compat.RatNationsNaturalRefreshVerification'
}

tasks.named('check').configure {
    dependsOn tasks.named('verifySporeCompat')
    dependsOn tasks.named('verifyRatNationsNaturalRefresh')
}
